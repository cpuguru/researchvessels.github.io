<title>Platform · ResearchVessels.org</title><link rel="canonical" href="https://researchvessels.org/platform.html"><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png" sizes="180x180">

<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous" defer></script>
<script src="assets/app.js"></script><script src="assets/external-links.js"></script><script src="data/vessels.js"></script><script src="data/platforms.js"></script><script src="data/manufacturers.js"></script><script src="assets/platforms.js"></script></head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
<main id="content" class="container py-4 flex-grow-1"><div id="p"><p>Loading&hellip;</p></div></main>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const el=document.getElementById('p'),h=RV.h,P=RVP,D=P.data(),own=P.own;
 const back=()=>h('p',null,h('a',{href:'platforms.html'},'\u2190 All platforms'));
 const fail=(title,...msg)=>{document.title=title+' \u00b7 ResearchVessels.org';el.replaceChildren(h('h1',null,title),h('p',null,...msg),back())};
 const raw=RV.qs('id');
 if(raw==null||raw===''){fail('No platform selected','Choose a platform from the ',h('a',{href:'platforms.html'},'platform list'),'.');return}
 if(!P.validId(raw)){fail('Not a valid platform ID','Platform IDs use only letters, digits, hyphens and underscores, up to 64 characters.');return}
 const p=P.find(raw);
 if(!p){fail('Platform not found','No platform with ID ',h('code',null,raw),' is in the registry yet. It may have been renamed, or not been added.');return}
 const name=p.display_name||p.name;
 document.title=name+' \u00b7 ResearchVessels.org';
 const sources=D.sources||{},cited=[],cite=sid=>{
  if(!sid||!own(sources,sid))return null;let i=cited.indexOf(sid);if(i<0){cited.push(sid);i=cited.length-1}
  return h('a',{href:'#src-'+(i+1),class:'small ms-1 text-decoration-none',title:String(sources[sid].title||''),'aria-label':'Source '+(i+1)},'['+(i+1)+']')};
 const sec=(id,title,...kids)=>h('section',{class:'mb-4','aria-labelledby':id},h('h2',{class:'h5',id},title),...kids);
 const dl=rows=>{const d=h('dl',{class:'row mb-0'});rows.forEach(([k,v])=>{if(v==null||v===''||(Array.isArray(v)&&!v.length))return;d.append(h('dt',{class:'col-sm-4 col-lg-3 fw-semibold'},k),h('dd',{class:'col-sm-8 col-lg-9'},v))});return d};
 const kids=[];
 kids.push(h('nav',{'aria-label':'Breadcrumb',class:'small mb-2'},h('a',{href:'platforms.html'},'Platforms'),' / ',p.platform_class||''));
 kids.push(h('h1',{class:'mb-1'},name));
 kids.push(h('p',{class:'mb-2'},P.classBadge(p.platform_class),' ',P.statusBadge(p.status),p.status_date?h('span',{class:'small text-body-secondary ms-2'},'as of '+p.status_date):null,
   p.aliases&&p.aliases.length?h('span',{class:'ms-3'},h('span',{class:'small text-body-secondary'},'Also called: '),p.aliases.map(a=>h('span',{class:'badge text-bg-light border text-dark me-1'},a))):null));
 kids.push(P.draftNotice('This record comes from public sources only and has not been checked by the University of Delaware.','Correction: '+name));
 (p.distinct_from||[]).forEach(did=>{const o=P.find(did);if(!o)return;
  kids.push(h('div',{class:'alert alert-info py-2',role:'note'},h('strong',null,'Not the same vehicle as '),h('a',{href:P.detailHref(did)},o.display_name||o.name),' ('+(o.platform_class||'')+'). They share only a nickname; keep the two records apart.'))});
 /* identity */
 const mf=(window.RV_MANUFACTURERS&&RV_MANUFACTURERS.manufacturers)||[];
 const mfMatch=p.manufacturer?mf.find(m=>String(m.name).toLowerCase().startsWith(String(p.manufacturer).toLowerCase().split(' (')[0])):null;
 const ids=p.external_ids||{},idLabels={wmo_id:'WMO ID',ices_c17:'ICES platform code (C17)'};
 kids.push(sec('id-h','Identity',dl([
   ['Class',(P.CLASS_NAME[p.platform_class]||p.platform_class)],
   ['Model',p.model?[p.model,p.model_note?h('div',{class:'small text-body-secondary'},p.model_note):null]:(p.model_note||null)],
   ['Maker',p.manufacturer?[p.manufacturer,mfMatch&&mfMatch.url?[' ',h('a',{href:mfMatch.url,class:'small'},'(maker site)')]:null]:null],
   ['Serial number',p.serial_number],
   ['Quantity',p.quantity!=null?[String(p.quantity),p.quantity_note?h('span',{class:'small text-body-secondary ms-1'},p.quantity_note):null]:null],
   ['Identifiers',Object.keys(ids).filter(k=>ids[k]!=null).map(k=>h('div',null,(own(idLabels,k)?idLabels[k]:k)+': ',h('code',null,String(ids[k]))))],
   ['Owner',p.owner_org?[p.owner_org,' ',h('span',{class:'badge text-bg-light border text-dark'},own(P.OWNERSHIP,p.ownership_type)?P.OWNERSHIP[p.ownership_type]:String(p.ownership_type||''))]:[h('span',{class:'badge text-bg-light border text-dark'},own(P.OWNERSHIP,p.ownership_type)?P.OWNERSHIP[p.ownership_type]:'Not stated')]],
   ['Ownership note',p.ownership_note],
   ['Operator',[p.operator_org,p.operating_unit?' \u2013 '+p.operating_unit:'']],
   ['People',(p.contacts||[]).map(c=>h('div',null,h('strong',null,c.name),' \u2013 '+(c.role||''),c.as_of?h('span',{class:'small text-body-secondary'},' (as of '+c.as_of+')'):null,cite(c.source_id)))],
   ['Based at',p.home_site]])));
 /* status */
 kids.push(sec('st-h','Status',h('p',{class:'mb-1'},P.statusBadge(p.status),' ',p.status_date?'as of '+p.status_date:''),h('p',{class:'mb-0 text-body-secondary'},p.status_basis||'No basis recorded.')));
 /* specs */
 const specRows=(p.specs||[]);
 const tb=h('tbody');
 specRows.forEach(s=>{const v=P.fmtValue(s.value,s.unit);
  tb.append(h('tr',null,h('th',{scope:'row',class:'fw-normal'},s.label),h('td',null,v?v:h('span',{class:'text-body-secondary'},'not published')),h('td',null,h('span',{class:'badge text-bg-light border text-dark text-wrap'},P.basisLabel(s.basis)),cite(s.source_id)),h('td',{class:'small text-body-secondary'},s.comment||'')))});
 kids.push(sec('sp-h','Specifications',specRows.length?h('div',{class:'table-responsive'},h('table',{class:'table table-sm align-middle bg-white border'},h('thead',{class:'table-light'},h('tr',null,h('th',{scope:'col'},'Spec'),h('th',{scope:'col'},'Value'),h('th',{scope:'col'},'Basis'),h('th',{scope:'col'},'Comment'))),tb)):h('p',{class:'text-body-secondary mb-0'},'No specifications have been published for this platform.')));
 /* sensors */
 const sens=p.sensors||[];
 if(sens.length){const st=h('tbody');sens.forEach(s=>st.append(h('tr',null,h('td',null,s.name,cite(s.source_id)),h('td',null,[s.maker,s.model].filter(Boolean).join(' ')||h('span',{class:'text-body-secondary'},'not stated')),h('td',null,s.serial_number||''),h('td',null,s.calibration_date||''),h('td',{class:'small text-body-secondary'},s.notes||''))));
  kids.push(sec('se-h','Sensors and payload',h('div',{class:'table-responsive'},h('table',{class:'table table-sm bg-white border'},h('thead',{class:'table-light'},h('tr',null,['Sensor','Maker / model','Serial','Calibration','Notes'].map(t=>h('th',{scope:'col'},t)))),st))))}
 else kids.push(sec('se-h','Sensors and payload',h('p',{class:'text-body-secondary mb-0'},'None published.')));
 if((p.applications||[]).length)kids.push(sec('ap-h','Applications',h('ul',{class:'mb-0'},p.applications.map(a=>h('li',null,a)))));
 /* deployments */
 const deps=p.deployments||[];
 if(deps.length){const vb=RV.byId(),dt=h('tbody');
  deps.forEach(d=>{
   const lv=d.launch_vessel;let vcell=null;
   if(lv&&lv.name){const vid=lv.vessel_id!=null&&own(vb,String(lv.vessel_id))?String(lv.vessel_id):null;vcell=h('div',null,vid?h('a',{href:RV.vesselHref(vid)},lv.name):lv.name,!vid&&lv.note?h('div',{class:'small text-body-secondary'},lv.note):null)}
   const when=(d.start||'?')+' \u2192 '+(d.end||'not logged');
   const dm=[d.days!=null?d.days+' d':null,d.distance_km!=null?fmt(d.distance_km)+' km':null].filter(Boolean).join(', ');
   function fmt(n){return Number(n).toLocaleString()}
   dt.append(h('tr',null,h('td',{class:'text-nowrap'},when,dm?h('div',{class:'small text-body-secondary'},dm):null,d.deployment_id?h('div',{class:'small text-body-secondary font-monospace'},d.deployment_id):null),
    h('td',null,d.project?h('strong',null,d.project):null,d.summary?h('div',{class:'small'},d.summary):null,d.note?h('div',{class:'small text-body-secondary'},d.note):null,cite(d.source_id)),
    h('td',null,d.region||''),h('td',{class:'small'},d.funder||''),h('td',null,vcell||''),
    h('td',{class:'small'},(d.data||[]).map(x=>h('div',null,h('a',{href:x.url},x.label||x.type||'data'))))))});
  kids.push(sec('dp-h','Deployment history',h('div',{class:'table-responsive'},h('table',{class:'table table-sm table-striped align-top bg-white border'},h('thead',{class:'table-light'},h('tr',null,['Dates (UTC)','Mission','Region','Funder','Launch vessel','Data'].map(t=>h('th',{scope:'col'},t)))),dt)),
    h('p',{class:'small text-body-secondary mt-1'},deps.length+' deployment'+(deps.length===1?'':'s')+' listed. A launch vessel links to the vessel directory only when the ship is already listed there.')))}
 else kids.push(sec('dp-h','Deployment history',h('p',{class:'text-body-secondary mb-0'},'No deployments are recorded for this platform.')));
 const de=p.data_endpoints||[];
 if(de.length)kids.push(sec('de-h','Data and catalog links',h('ul',{class:'mb-0'},de.map(x=>h('li',null,h('a',{href:x.url},x.label||x.type))))));
 const ph=p.photos||[];
 if(ph.length)kids.push(sec('ph-h','Photos',h('p',{class:'small text-body-secondary mb-1'},'Links only. We do not copy photos without permission.'),h('ul',{class:'mb-0'},ph.map(x=>h('li',null,h('a',{href:x.url},x.label||'Photo'))))));
 if((p.notes||[]).length)kids.push(sec('no-h','Notes',h('ul',{class:'mb-0'},p.notes.map(n=>h('li',null,n)))));
 /* provenance */
 const pv=p.provenance||{};
 kids.push(sec('pv-h','Provenance',dl([['Record status',pv.record_status?h('span',{class:'badge text-bg-warning'},pv.record_status):null],['Last verified',pv.last_verified],['Method',pv.verified_by],['Confidence',pv.confidence],['Known gaps',(pv.gaps||[]).join('; ')]]),
   h('p',{class:'small mt-2 mb-0'},'See something wrong or missing? ',P.mailLink('Correction: '+name),'. Machine-readable record: ',h('a',{href:'data/platforms.json'},'data/platforms.json'),' (CC BY 4.0, "Data compiled by Doug White / researchvessels.org").')));
 /* sources: only the ones cited above, plus any other listed for this record */
 (p.source_ids||[]).forEach(s=>{if(own(sources,s)&&!cited.includes(s))cited.push(s)});
 const ol=h('ol',{class:'small mb-0'});
 cited.forEach((sid,i)=>{const s=sources[sid];ol.append(h('li',{id:'src-'+(i+1)},h('a',{href:s.url},s.title||s.url),' \u2013 '+[s.publisher,s.published].filter(Boolean).join(', ')+(s.accessed?' (accessed '+s.accessed+')':'')))});
 kids.push(sec('src-h','Sources',ol));
 kids.push(back());
 el.replaceChildren(...kids);
});
</script></body></html>
